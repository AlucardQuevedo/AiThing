<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Emotion Detector</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(-45deg,#0f0f0f,#1f1f1f,#111,#222);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    color:white;
    text-align:center;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1{
    margin-top:20px;
    font-size:60px;
    text-shadow:0 0 20px cyan;
    letter-spacing:3px;
}

button{
    padding:15px 35px;
    font-size:24px;
    border:none;
    border-radius:15px;
    background:cyan;
    color:black;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 0 20px cyan;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 40px cyan;
}

#webcam-container{
    margin-top:30px;
    position:relative;
    display:inline-block;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(255,255,255,0.25);
}

canvas{
    border-radius:25px;
    border:4px solid white;
}

#message{
    margin-top:25px;
    font-size:32px;
    width:70%;
    margin-left:auto;
    margin-right:auto;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(255,255,255,0.1);
    transition:0.4s;
}

#countdown{
    font-size:120px;
    font-weight:bold;
    text-shadow:0 0 30px white;
    margin-top:20px;
}

#mogText{
    display:none;
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:20;

    font-size:120px;
    color:red;
    font-weight:bold;

    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 60px darkred;

    animation:shake 0.15s infinite;
}

@keyframes shake{
    0%{transform:translate(-50%,-50%) translateX(-5px);}
    50%{transform:translate(-50%,-50%) translateX(5px);}
    100%{transform:translate(-50%,-50%) translateX(-5px);}
}

#censorBar{
    position:absolute;

    width:70%;
    height:50px;

    left:15%;
    top:28%;

    background:black;

    display:none;
    align-items:center;
    justify-content:center;

    color:red;
    font-size:34px;
    font-weight:bold;

    border-radius:10px;

    letter-spacing:4px;

    box-shadow:0 0 20px red;

    z-index:15;
}

.pulse{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

#statusBanner{
    font-size:24px;
    margin-bottom:15px;
    color:#00ff88;
    font-weight:bold;
}

#confidenceBox{
    margin-top:15px;
    font-size:24px;
    opacity:0.8;
}
</style>
</head>

<body>

<h1>AI Emotion Detector</h1>
<div id="statusBanner">
    AI READY
</div>


<button onclick="init()">START</button>

<div id="webcam-container">

    <div id="censorBar">
        MOGGED
    </div>

    <div id="mogText">
        MOGGED
    </div>

</div>

<div id="countdown"></div>

<div id="confidenceBox">
    Confidence: 0%
</div>

<div id="message">
    Waiting...
</div>

<script>

const URL = "./my_model/";

let model, webcam, maxPredictions;

let lastPrediction = "";
let mogCooldown = false;

let detectionHistory = [];
const HISTORY_SIZE = 15;

const winSound = new Audio("win.mp3");
const loseSound = new Audio("lose.mp3");
const battleSound = new Audio("battle.mp3");

winSound.volume = 1.0;
loseSound.volume = 1.0;
battleSound.volume = 0.8;

async function init() {

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    maxPredictions = model.getTotalClasses();

    const flip = true;

    webcam = new tmImage.Webcam(500, 500, flip);

    try {
    await webcam.setup();
} catch(err){
    alert("Webcam permission denied or unavailable");
    console.error(err);
    return;
}
    document.getElementById("message").innerHTML =
        "Webcam started!";

    document.getElementById("webcam-container")
        .appendChild(webcam.canvas);

    window.requestAnimationFrame(loop);

    await webcam.play();

    window.requestAnimationFrame(loop);

    document.getElementById("webcam-container")
        .appendChild(webcam.canvas);
}

async function loop() {

    webcam.update();

    await predict();

    window.requestAnimationFrame(loop);
}

async function predict() {

    if(mogCooldown){
        return;
    }

    const prediction = await model.predict(webcam.canvas);

    console.clear();

prediction.forEach(p => {
    console.log(
        p.className + ": " +
        (p.probability * 100).toFixed(1) + "%"
    );
});

    let highest = prediction[0];

    for(let i = 1; i < prediction.length; i++){

        if(prediction[i].probability > highest.probability){
            highest = prediction[i];
        }
    }

    document.getElementById("confidenceBox").innerHTML =
    "Confidence: " + Math.round(highest.probability * 100) + "%";

    if(highest.probability < 0.50){
    return;
}

    detectionHistory.push(highest.className);

    if(detectionHistory.length > HISTORY_SIZE){
        detectionHistory.shift();
    }

    const counts = {};

    detectionHistory.forEach(item=>{
        counts[item] = (counts[item] || 0) + 1;
    });

    let winner = null;
    let maxCount = 0;

    for(const emotion in counts){

        if(counts[emotion] > maxCount){

            maxCount = counts[emotion];
            winner = emotion;
        }
    }

    if(maxCount >= 8){

        if(winner !== lastPrediction){

            lastPrediction = winner;

            handleEmotion(winner);
        }
    }
}

function resetEffects(){

    document.getElementById("mogText").style.display = "none";

    document.getElementById("censorBar").style.display = "none";

    document.getElementById("message")
        .classList.remove("pulse");

    document.body.style.filter = "brightness(1)";
}

function handleEmotion(emotion){
    document.getElementById("statusBanner").innerHTML =
"DETECTED: " + emotion.toUpperCase();

    const message = document.getElementById("message");

    resetEffects();

    if(emotion === "Happy"){

        document.body.style.filter = "hue-rotate(80deg)";

        message.innerHTML =
        "😊 Happiness helps reduce stress and can improve motivation and energy.";

    }

    else if(emotion === "Sad"){

        document.body.style.filter = "hue-rotate(220deg)";

        message.innerHTML =
        "😢 Try taking deep breaths, listening to music, resting, or talking to someone you trust.";

    }

    else if(emotion === "Angry"){

        document.body.style.filter = "hue-rotate(320deg)";

        message.innerHTML =
        "😡 Slow breathing, drinking water, or stepping away for a minute can help calm anger.";

    }

    else if(emotion === "Larry"){

        document.body.style.filter = "hue-rotate(140deg)";

        message.innerHTML =
        "🗿 LARRY DETECTED.";

    }

    else if(emotion === "Mog"){

        if(!mogCooldown){

            startMogBattle();
        }
    }
}

async function startMogBattle(){

    mogCooldown = true;

    // LOCK emotion detection during mog battle
    lastPrediction = "LOCKED";

    const countdown = document.getElementById("countdown");

    const message = document.getElementById("message");

    resetEffects();

    message.innerHTML = "⚔️ MOG OFF INITIATED ⚔️";
    battleSound.currentTime = 0;
battleSound.play().catch(()=>{});

// Stop after 3 seconds
setTimeout(() => {
    battleSound.pause();
    battleSound.currentTime = 0;
}, 3000);


    for(let i = 3; i >= 1; i--){

        countdown.innerHTML = i;

        await sleep(1000);
    }

    countdown.innerHTML = "GO";

    await sleep(800);

    countdown.innerHTML = "";

    const userWins = Math.random() > 0.5;

    if(userWins){

        document.body.style.filter = "hue-rotate(90deg)";

        message.innerHTML =
        "🔥 YOU WON THE MOG OFF 🔥";
        winSound.play().catch(()=>{});

        message.classList.add("pulse");
    }

    else{
        loseSound.play().catch(()=>{});

        document.body.style.filter = "brightness(0.3)";

        document.getElementById("mogText")
            .style.display = "block";

        document.getElementById("censorBar")
            .style.display = "flex";

        message.innerHTML =
        "💀 YOU GOT MOGGED 💀";

        navigator.vibrate?.(500);
        document.body.animate(
[
    {transform:"translateX(-10px)"},
    {transform:"translateX(10px)"},
    {transform:"translateX(-10px)"}
],
{
    duration:300,
    iterations:5
}
);
    }

    // WAIT before allowing emotions again
    await sleep(5000);

    mogCooldown = false;

    // UNLOCK predictions
    lastPrediction = "";
}

function sleep(ms){

    return new Promise(resolve => setTimeout(resolve, ms));
}

</script>

</body>
</html>
