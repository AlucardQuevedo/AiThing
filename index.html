<!DOCTYPE html>
<html>
<head>
    <title>Emotion Detector</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body{
            background-color:#111;
            color:white;
            font-family:Arial;
            text-align:center;
            margin:0;
            overflow:hidden;
        }

        h1{
            font-size:50px;
            margin-top:20px;
        }

        #webcam-container{
            margin-top:20px;
            position:relative;
            display:inline-block;
        }

        canvas{
            border:5px solid white;
            border-radius:20px;
        }

        #message{
            margin-top:30px;
            font-size:30px;
            padding:20px;
        }

        #mogText{
            font-size:70px;
            color:red;
            font-weight:bold;
            text-shadow:0 0 20px red;
            display:none;
        }

        #countdown{
            font-size:80px;
            margin-top:20px;
        }

        #censorBar{
            position:absolute;
            width:180px;
            height:40px;
            background:black;
            top:70px;
            left:10px;
            display:none;
            align-items:center;
            justify-content:center;
            color:red;
            font-weight:bold;
            font-size:28px;
        }
    </style>
</head>

<body>

<h1>AI Emotion Detector</h1>

<button onclick="init()">START</button>

<div id="webcam-container">
</div>

<div id="countdown"></div>

<div id="message">
    Waiting...
</div>

<div id="mogText">MOGGED</div>

<script>

const URL = "./my_model/";

let model, webcam, maxPredictions;

let lastPrediction = "";
let mogCooldown = false;

async function init() {

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    const flip = true;

    webcam = new tmImage.Webcam(300, 300, flip);

    await webcam.setup();
    await webcam.play();

    window.requestAnimationFrame(loop);

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    // create censor bar
    const censor = document.createElement("div");
    censor.id = "censorBar";
    censor.innerHTML = "MOGGED";

    document.getElementById("webcam-container").appendChild(censor);
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {

    const prediction = await model.predict(webcam.canvas);

    let highest = prediction[0];

    for(let i = 1; i < prediction.length; i++){
        if(prediction[i].probability > highest.probability){
            highest = prediction[i];
        }
    }

    const detected = highest.className;

    // only trigger if confidence high enough
    if(highest.probability > 0.85){

        if(detected !== lastPrediction){

            lastPrediction = detected;

            handleEmotion(detected);
        }
    }
}

function handleEmotion(emotion){

    const message = document.getElementById("message");

    document.body.style.backgroundColor = "#111";

    document.getElementById("mogText").style.display = "none";
    document.getElementById("censorBar").style.display = "none";

    if(emotion === "Happy"){

        document.body.style.backgroundColor = "#ffe066";

        message.innerHTML =
        "😊 Being happy is good for your brain. Happiness can help lower stress and improve motivation.";

    }

    else if(emotion === "Sad"){

        document.body.style.backgroundColor = "#4d79ff";

        message.innerHTML =
        "😢 Try taking deep breaths, talking to someone you trust, listening to music, or getting some sleep.";

    }

    else if(emotion === "Angry"){

        document.body.style.backgroundColor = "#cc0000";

        message.innerHTML =
        "😡 Try calming down by breathing slowly, drinking water, or taking a short break.";

    }

    else if(emotion === "Larry"){

        document.body.style.backgroundColor = "#8a2be2";

        message.innerHTML =
        "🗿 LARRY DETECTED.";

    }

    else if(emotion === "Mog"){

        if(!mogCooldown){
            startMogBattle();
        }
    }
}

async function startMogBattle(){

    mogCooldown = true;

    const countdown = document.getElementById("countdown");
    const message = document.getElementById("message");

    message.innerHTML = "⚔️ MOG OFF INITIATED";

    for(let i = 3; i >= 1; i--){

        countdown.innerHTML = i;

        await sleep(1000);
    }

    countdown.innerHTML = "GO";

    await sleep(800);

    countdown.innerHTML = "";

    const userWins = Math.random() > 0.5;

    if(userWins){

        document.body.style.backgroundColor = "#00cc66";

        message.innerHTML = "🔥 YOU WON THE MOG OFF 🔥";

    }
    else{

        document.body.style.backgroundColor = "black";

        document.getElementById("mogText").style.display = "block";

        document.getElementById("censorBar").style.display = "flex";

        message.innerHTML = "💀 YOU GOT MOGGED 💀";
    }

    setTimeout(()=>{
        mogCooldown = false;
    },5000);
}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

</script>

</body>
</html>
